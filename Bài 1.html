<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang giới thiệu tương tác</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #dbeafe, #fce7f3, #fef3c7);
        transition:
          background-color 0.3s,
          color 0.3s,
          background 0.5s;
      }
      header,
      footer {
        background: linear-gradient(135deg, #7c3aed, #db2777);
        padding: 20px;
        text-align: center;
        color: white;
      }
      nav {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px;
        background-color: #172554;
      }
      nav a {
        display: inline-block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        border-radius: 8px;
        transition: background-color 0.2s, transform 0.2s;
      }
      nav a:hover {
        background-color: #2563eb;
        transform: translateY(-2px);
      }
      main {
        width: min(760px, calc(100% - 32px));
        margin: 32px auto;
        padding: 42px 24px;
        min-height: 300px;
        text-align: center;
        background-color: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(124, 58, 237, 0.15);
        border-radius: 20px;
        box-shadow: 0 16px 35px rgba(30, 41, 59, 0.14);
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      h2 {
        color: #7c3aed;
        font-size: 1.6rem;
      }
      p {
        color: #475569;
        line-height: 1.7;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        border: none;
        border-radius: 10px;
        margin-top: 20px;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
      }
      .dark-mode-header-footer {
        background: linear-gradient(135deg, #111827, #312e81) !important;
        color: white !important;
      }
      .dark-mode-main {
        background-color: rgba(15, 23, 42, 0.92) !important;
      }
      .dark-mode-main h2,
      .dark-mode-main p {
        color: #e0e7ff !important;
      }
      @media (max-width: 520px) {
        main {
          width: min(100% - 20px, 760px);
          margin: 20px auto;
          padding: 30px 16px;
        }
        nav a {
          padding: 10px 12px;
        }
      }
    </style>
  </head>
  <body>
    <header id="myHeader">
      <h1>Trang Cá Nhân Của Tôi</h1>
    </header>

    <nav>
      <a href="#">Trang chủ</a>
      <a href="#">Giới thiệu</a>
      <a href="#">Sở thích</a>
    </nav>

    <main id="myMain">
      <h2 id="welcomeMessage">Đang tải lời chào...</h2>
      <p>Chào mừng bạn đến với trang giới thiệu tương tác.</p>

      <button id="colorButton">Đổi màu nền (Dark Mode)</button>
    </main>

    <footer id="myFooter">
      <p>Ngô Văn Huy _ B25DCTV029. Bài tập thực hành DOM.</p>
    </footer>

    <script>
      const welcomeMessageElement = document.getElementById("welcomeMessage");
      const currentHour = new Date().getHours();

      let greeting = "";
      if (currentHour < 12) {
        greeting = "Chào buổi sáng! Chúc bạn ngày mới tốt lành.";
      } else if (currentHour < 18) {
        greeting = "Chào buổi chiều! Chúc bạn làm việc hiệu quả.";
      } else {
        greeting = "Chào buổi tối! Chúc bạn một buổi tối thư giãn.";
      }

      welcomeMessageElement.innerText = greeting;

      const colorButton = document.getElementById("colorButton");
      const header = document.getElementById("myHeader");
      const footer = document.getElementById("myFooter");
      const main = document.getElementById("myMain");

      let isDarkMode = false;

      colorButton.addEventListener("click", function () {
        if (!isDarkMode) {
          document.body.style.background = "linear-gradient(135deg, #0f172a, #312e81, #701a75)";
          document.body.style.color = "#fff";
          header.classList.add("dark-mode-header-footer");
          footer.classList.add("dark-mode-header-footer");
          main.classList.add("dark-mode-main");
          colorButton.innerText = "Trở về nền sáng";
        } else {
          document.body.style.background = "linear-gradient(135deg, #dbeafe, #fce7f3, #fef3c7)";
          document.body.style.color = "#1e293b";
          header.classList.remove("dark-mode-header-footer");
          footer.classList.remove("dark-mode-header-footer");
          main.classList.remove("dark-mode-main");
          colorButton.innerText = "Đổi màu nền (Dark Mode)";
        }
        isDarkMode = !isDarkMode;
      });
    </script>
  </body>
</html>
