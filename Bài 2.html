<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Bài Thực Hành 2 - Máy Tính Đơn Giản</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .calculator {
        width: 320px;
        background-color: #ffffff;
        border: 1px solid #dcdfe6;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      .calculator h3 {
        text-align: center;
        margin: 0 0 15px 0;
        color: #0066cc;
        font-size: 1.1rem;
      }

      #display {
        width: 100%;
        height: 60px;
        background-color: #222222;
        color: #00ff66;
        font-size: 26px;
        font-family: "Courier New", Courier, monospace;
        text-align: right;
        line-height: 60px;
        padding: 0 15px;
        box-sizing: border-box;
        border-radius: 6px;
        margin-bottom: 20px;
        overflow: hidden;
        word-break: break-all;
      }

      .buttons-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      button {
        height: 50px;
        font-size: 18px;
        font-weight: bold;
        border: 1px solid #dcdfe6;
        border-radius: 6px;
        background-color: #f8fafc;
        color: #333333;
        cursor: pointer;
        transition: 0.15s;
      }

      button:hover {
        background-color: #e2e8f0;
      }

      button.operator {
        background-color: #ff9800;
        color: white;
        border: none;
      }

      button.operator:hover {
        background-color: #e68900;
      }

      /* Nút Clear xóa toàn bộ */
      button#btnClear {
        background-color: #f44336;
        color: white;
        border: none;
      }

      button#btnClear:hover {
        background-color: #d32f2f;
      }

      /* Nút Delete xóa từng ký tự */
      button#btnDelete {
        background-color: #64748b;
        color: white;
        border: none;
      }

      button#btnDelete:hover {
        background-color: #475569;
      }

      /* Nút Bằng (=) */
      button#btnEqual {
        background-color: #0066cc;
        color: white;
        border: none;
        grid-column: span 2;
      }

      button#btnEqual:hover {
        background-color: #0052a3;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <h3>MÁY TÍNH CÁ NHÂN</h3>

      <div id="display">0</div>

      <div class="buttons-grid">
        <!-- Hàng 1: Nút Clear và Nút DEL xóa từng số -->
        <button id="btnClear">Clear</button>
        <button id="btnDelete">DEL</button>
        <button class="btn-input operator">/</button>
        <button class="btn-input operator">*</button>

        <!-- Hàng 2 -->
        <button class="btn-input">7</button>
        <button class="btn-input">8</button>
        <button class="btn-input">9</button>
        <button class="btn-input operator">-</button>

        <!-- Hàng 3 -->
        <button class="btn-input">4</button>
        <button class="btn-input">5</button>
        <button class="btn-input">6</button>
        <button class="btn-input operator">+</button>

        <!-- Hàng 4 -->
        <button class="btn-input">1</button>
        <button class="btn-input">2</button>
        <button class="btn-input">3</button>
        <button class="btn-input">.</button>

        <!-- Hàng 5 -->
        <button class="btn-input" style="grid-column: span 2">0</button>
        <button id="btnEqual">=</button>
      </div>
    </div>

    <script>
      const display = document.getElementById("display");
      const inputButtons = document.querySelectorAll(".btn-input");
      const btnClear = document.getElementById("btnClear");
      const btnDelete = document.getElementById("btnDelete");
      const btnEqual = document.getElementById("btnEqual");

      // 1. Nhập số và toán tử
      inputButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          const char = button.innerText;

          if (display.innerText === "0" || display.innerText === "Lỗi") {
            if (char === ".") {
              display.innerText = "0.";
            } else {
              display.innerText = char;
            }
          } else {
            display.innerText = display.innerText + char;
          }
        });
      });

      // 2. Nút Clear: xóa toàn bộ về 0
      btnClear.addEventListener("click", function () {
        display.innerText = "0";
      });

      // 3. Nút DEL: xóa từng ký tự một từ cuối chuỗi
      btnDelete.addEventListener("click", function () {
        const currentText = display.innerText;

        // Nếu đang báo lỗi hoặc chuỗi chỉ còn 1 ký tự thì bấm xóa sẽ về 0
        if (currentText === "Lỗi" || currentText.length <= 1) {
          display.innerText = "0";
        } else {
          // Cắt bỏ ký tự cuối cùng
          display.innerText = currentText.slice(0, -1);
        }
      });

      // 4. Nút =: tính toán kết quả
      btnEqual.addEventListener("click", function () {
        const expression = display.innerText;

        if (expression === "" || expression === "Lỗi") {
          return;
        }

        try {
          const calculate = new Function("return " + expression);
          const result = calculate();

          if (isFinite(result)) {
            display.innerText = result;
          } else {
            display.innerText = "Lỗi";
          }
        } catch (error) {
          display.innerText = "Lỗi";
        }
      });
    </script>
  </body>
</html>
